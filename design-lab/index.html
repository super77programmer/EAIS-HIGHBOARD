</style></head><body><header class="lab"><div><h1>High Board · Homepage Lab</h1><p>Ten layouts in the main app’s theme. Fictional sample content.</p></div><div class="lab-tools"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button><button id="reset">Clear shortlist</button></div></header><nav class="options" aria-label="Homepage concepts" role="tablist"></nav><section class="review"><div><h2 id="concept-name"></h2><p id="concept-description"></p></div><button id="choose">Shortlist this</button></section><main id="preview"></main><dialog id="detail"><h2 id="detail-title"></h2><p id="detail-copy"></p><form method="dialog"><button>Close</button></form></dialog><script>
const designs=[['Focused agenda','A calm daily overview, with upcoming events kept secondary.','one'],['School workspace','A persistent sidebar and compact, task-oriented dashboard.','two'],['The bulletin','Editorial typography and a school-news-first composition.','three'],['Everyday mobile','Large shortcuts, stacked cards and familiar bottom navigation.','four'],['Weekly planner','A timetable-first view with a small personal checklist.','five'],['Priority cards','Clear priorities in an airy grid using the app’s coral accents.','six'],['Essential home','Only the next event, message and deadline above the fold.','seven'],['Timeline','A chronological day with supporting actions in a quiet side panel.','eight'],['Split overview','Today and the week in two balanced, readable columns.','nine'],['Action hub','Four familiar destinations, then the school information you need.','ten']];
const brand='<div class="brand"><img src="brand/eais-charcoal.svg" alt="EAIS" width="58" height="29"><span class="brand-divider"></span><span>High Board<small>STUDENT LIFE</small></span></div>';
const links='<div class="navlinks">'+['Home','Calendar','Messages','Student voice','Canteen'].map(n=>`<button data-action="${n}">${n}</button>`).join('')+'</div>';
const nav='';
const appFrame=content=>`<div class="app-frame"><aside class="app-rail">${brand}<p class="rail-label">YOUR SCHOOL SPACE</p>${['Home','Calendar','Schedules','Messages','Student voice','Canteen'].map((n,i)=>`<button data-action="${n}" ${i===0?'aria-current="page"':''}><span aria-hidden="true" class="nav-symbol">${['▦','▤','▥','✉','◇','☷'][i]}</span><span>${n}</span></button>`).join('')}<div class="rail-foot">EAIS · New Cairo<br><span>Student High Board</span></div></aside><div class="app-body"><header class="app-top"><span>Student life <b>Home</b></span><div><button data-action="Help">How to use</button><button class="class-button" data-action="Profile"><span class="avatar">A</span><span><b>Class 9E</b><small>Grade 9</small></span></button></div></header>${content}<nav class="app-bottom" aria-label="Main app mobile navigation">${['Home','Calendar','Messages','Voice','Canteen'].map((n,i)=>`<button data-action="${n==='Voice'?'Student voice':n}" ${i===0?'aria-current="page"':''}><span aria-hidden="true">${['▦','▤','✉','◇','☷'][i]}</span>${n}</button>`).join('')}</nav></div></div>`;
const foot='<footer><b>High Board</b><p>Managed independently by the Student High Board for student life updates. For official academic records, use Google Classroom.</p><span>Preview data · Cairo time · Privacy &amp; data</span></footer>';
const greet=(title='Good morning, Ahmed.')=>`<div class="greeting"><div><div class="eyebrow">Thursday · 8 October</div><h2>${title}</h2><p>Your school day, at a glance.</p></div><span class="tag">Grade 9 · Section E</span></div>`;
const row=(time,title,sub)=>`<div class="row"><span class="time">${time}</span><div><h4>${title}</h4><p>${sub}</p></div></div>`;
const event=(day,title,sub)=>`<div class="row"><div class="date">OCT<b>${day}</b></div><div><h4>${title}</h4><p>${sub}</p></div></div>`;
const btn=(label,action=label)=>`<button class="action" data-action="${action}">${label}</button>`;
const today=()=>row('08:15','Math assessment','Room 204 · Chapters 3–4')+row('10:30','High Board meeting','Student lounge · Bring your ideas')+row('14:00','Football trials','School pitch · Grades 9–12');
const pending=()=>`<div class="notice"><h4>Trip payment closes Sunday</h4><p>Confirm the details before paying through the school.</p><button class="textbtn" data-action="Trip details">View details</button></div>`;
const message=()=>`<div class="row"><span class="avatar">MK</span><div><h4>Mr. Karim</h4><p>“I’ve reviewed your assignment.”</p></div><span class="tag">1</span></div><button class="textbtn" data-action="Messages">Open messages</button>`;
const upcoming=()=>event('11','Trip payment deadline','Sunday · School finance office')+event('13','English assessment','Tuesday · Grade 9')+event('17','School carnival','Saturday · Main courtyard');
const poll=()=>`<h4>What should we add to lunch?</h4><p>Have your say in the student poll.</p><button class="textbtn" data-action="Poll">Vote in the poll</button>`;
const menu=()=>`<h4>Today’s lunch</h4><p>Chicken wrap · Rice bowl · Fruit cup</p><button class="textbtn" data-action="Canteen">View canteen menu</button>`;
function render(i){let html='';if(i===0)html=nav+`<div class="pad">${greet()}<div class="grid cols"><section class="card today"><div class="meta"><h3>Today</h3><button class="textbtn" data-action="Calendar">Full calendar</button></div>${today()}</section><aside class="card"><h3>For you</h3>${message()}${pending()}</aside></div><section class="minor"><h3>Coming up</h3><div class="grid">${['11|Trip payment|Closes Sunday','13|English assessment|Tuesday · Grade 9','17|School carnival|Saturday · Courtyard'].map(x=>{let a=x.split('|');return `<div class="card">${event(...a)}</div>`}).join('')}</div></section><div class="actions" style="margin-top:24px">${btn('Share an idea','Student voice')}${btn('Today’s canteen','Canteen')}</div></div>`+foot;
if(i===1)html=`<div class="workspace">${greet('Everything you need today.')}<div class="grid metrics"><div class="metric"><span class="muted">Today’s events</span><b>3</b><span class="muted">First at 08:15</span></div><div class="metric"><span class="muted">Unread chats</span><b>1</b><button class="textbtn" data-action="Messages">View inbox</button></div><div class="metric"><span class="muted">Open polls</span><b>2</b><button class="textbtn" data-action="Poll">Take part</button></div></div><div class="grid cols"><section class="card"><h3>Your agenda</h3>${today()}<button class="textbtn" data-action="Calendar">View all events</button></section><section class="card"><h3>Next deadlines</h3>${event('11','Trip payment','School finance office')}${event('13','English assessment','Chapters 2–3')}</section><section class="card"><h3>Teacher messages</h3>${message()}</section><section class="card">${menu()}</section></div></div>`+foot;
if(i===2)html=nav+`<div class="pad"><div class="edition"><span>THURSDAY, 8 OCTOBER 2026</span><span>GRADE 9E · PREVIEW EDITION</span></div><div class="lead"><section><div class="eyebrow">This week at school</div><h2>This week at EAIS.</h2><p>Clubs, football trials and the student carnival. Here’s what belongs on your calendar.</p><div class="feature"><span class="eyebrow">Student life</span><h3>School carnival · 17 October</h3><p>Meet your classmates in the main courtyard for a day of student-led activities.</p>${btn('View event','Carnival')}</div><article class="headline"><span class="eyebrow">Deadline · Sunday</span><h3>Confirm your place on the trip.</h3><p>Check the payment deadline and school instructions.</p><button class="textbtn" data-action="Trip details">Read the update</button></article></section><aside class="agenda"><h3>Today’s agenda</h3>${today()}<button class="textbtn" data-action="Calendar">Full calendar</button><div style="margin-top:30px"><h3>In your inbox</h3>${message()}</div></aside></div><section class="lower"><article>${poll()}</article><article>${menu()}</article><article><h4>Your ideas matter</h4><p>Send a private suggestion to the High Board.</p><button class="textbtn" data-action="Student voice">Share an idea</button></article></section></div>`+foot;
if(i===3)html=nav+`<div class="pad">${greet('Ready for today?')}<div class="grid quick">${[['Calendar','▦'],['Messages','✉'],['Student voice','＋'],['Canteen','☷']].map(([n,icon])=>`<button data-action="${n}"><span aria-hidden="true">${icon}</span>${n==='Student voice'?'Your voice':n}</button>`).join('')}</div><section class="hero-day"><div class="date">OCT<b>08</b></div><div><span class="eyebrow">Up next · 08:15</span><h3>Math assessment</h3><p style="margin:0">Room 204 · Chapters 3–4</p></div></section><section class="card"><div class="meta"><h3>Your messages</h3><span class="tag">1 unread</span></div>${message()}</section><section class="card"><h3>Later today</h3>${row('10:30','High Board meeting','Student lounge')}${row('14:00','Football trials','School pitch')}</section><section class="card"><h3>Don’t miss</h3>${event('11','Trip payment closes','Sunday · School finance office')}</section></div><nav class="bottom" aria-label="Concept app navigation">${['Home','Calendar','Messages','Your voice','Canteen'].map(n=>`<button data-action="${n==='Your voice'?'Student voice':n}">${n}</button>`).join('')}</nav>`+foot;
if(i===4)html=nav+`<div class="pad">${greet('Make room for your week.')}<div class="grid planner"><section><div class="meta"><h3>5–9 October</h3><button class="textbtn" data-action="Calendar">Month view</button></div><div class="grid week">${[['MON','05','Math practice',''],['TUE','06','Art club','teal'],['WED','07','Science lab',''],['THU','08','08:15 Math assessment','selected'],['FRI','09','Weekend','']].map(([d,date,t,c])=>`<div class="day ${c==='selected'?c:''}"><span class="eyebrow">${d}</span><strong>${date}</strong><div class="slot ${c==='teal'?'teal':''}">${t}</div>${c==='selected'?'<div class="slot teal">10:30 Board meeting</div><div class="slot orange">14:00 Football trials</div>':''}</div>`).join('')}</div><section class="card" style="margin-top:24px"><h3>Personal checklist</h3><p class="muted">Preview only. These checks reset when you switch designs.</p>${['Review assessment chapters','Read Mr. Karim’s feedback','Check the trip deadline'].map(t=>`<label class="task"><input type="checkbox">${t}</label>`).join('')}</section></section><aside><section class="card"><h3>Next deadline</h3>${event('11','Trip payment','Closes Sunday')}${btn('View details','Trip details')}</section><section class="card"><h3>Messages</h3>${message()}</section><section class="card">${menu()}</section></aside></div></div>`+foot;
if(i===5)html=nav+`<div class="pad">${greet('School life. Sorted.')}<div class="grid tiles"><section class="tile large"><div><div class="eyebrow">Thursday · Your agenda</div><h3>Today starts here.</h3>${today()}</div><button class="textbtn" data-action="Calendar">View calendar</button></section><section class="tile blue"><div><span class="eyebrow">Teacher chat</span><h3>One new reply.</h3><p>Mr. Karim has reviewed your assignment.</p></div><button class="textbtn" data-action="Messages">Open messages</button></section><section class="tile pink"><div><span class="eyebrow">Student voice</span><h3>Your next idea.</h3><p>A better school starts with what you notice.</p></div><button class="textbtn" data-action="Student voice">Send a suggestion</button></section><section class="tile"><div><span class="eyebrow">Sunday · 11 Oct</span><h3>Trip deadline.</h3><p>Check the details before the payment window closes.</p></div><button class="textbtn" data-action="Trip details">View details</button></section><section class="tile"><div>${menu()}</div></section><section class="tile dark"><div><span class="eyebrow">17 October · Student life</span><h3>Save the carnival date.</h3><p>Student-led activities in the main courtyard.</p></div><button class="textbtn" data-action="Carnival">View event</button></section><section class="tile" style="grid-column:span 2;min-height:170px"><div>${poll()}</div></section></div></div>`+foot;

if(i===6)html=`<div class="pad">${greet('Good morning, Ahmed.')}<section class="essential-next card"><div><span class="eyebrow">NEXT UP · TODAY, 08:15</span><h2>Math assessment</h2><p>Room 204 · Chapters 3–4</p></div>${btn('View calendar','Calendar')}</section><div class="grid essential-grid"><section class="card"><span class="eyebrow">YOUR INBOX</span><h3>A reply from your teacher</h3>${message()}</section><section class="card"><span class="eyebrow">NEEDS ATTENTION</span><h3>Trip payment closes Sunday</h3><p>Check the school instructions before the deadline.</p>${btn('View details','Trip details')}</section></div><details class="more-day"><summary>Later today · 2 events</summary>${row('10:30','High Board meeting','Student lounge')}${row('14:00','Football trials','School pitch')}</details><div class="simple-links"><button data-action="Canteen">Today’s canteen menu</button><button data-action="Student voice">Share an idea privately</button><button data-action="Poll">Open polls</button></div></div>`+foot;
if(i===7)html=`<div class="pad">${greet('Your day, in order.')}<div class="grid timeline-grid"><section><div class="meta"><h3>Thursday’s timeline</h3><button class="textbtn" data-action="Calendar">Full calendar</button></div><div class="day-timeline">${[['08:15','Math assessment','Room 204 · Chapters 3–4','Calendar'],['10:30','High Board meeting','Student lounge · Bring one idea','Student voice'],['14:00','Football trials','School pitch · Grades 9–12','Calendar']].map(([t,n,sub,a],j)=>`<article class="timeline-event"><div class="timeline-stamp">${t}<span aria-hidden="true"></span></div><div class="card"><span class="eyebrow">${j===0?'UP NEXT':'LATER TODAY'}</span><h3>${n}</h3><p>${sub}</p><button class="textbtn" data-action="${a}">View details</button></div></article>`).join('')}</div></section><aside><section class="card"><h3>Your messages</h3>${message()}</section><section class="card"><h3>Next deadline</h3>${event('11','Trip payment','Sunday · Finance office')}<button class="textbtn" data-action="Trip details">View details</button></section><section class="quiet-link">${menu()}</section></aside></div></div>`+foot;
if(i===8)html=`<div class="pad">${greet('A clearer school week.')}<div class="grid split-grid"><section class="card split-today"><div class="meta"><h3>Today</h3><span class="tag">Thu 08</span></div>${today()}<div class="split-action">${btn('View calendar','Calendar')}</div></section><section class="card split-week"><div class="meta"><h3>Coming up</h3><span class="muted">Next 7 days</span></div>${upcoming()}<button class="textbtn" data-action="Calendar">See all dates</button></section></div><div class="grid split-bottom"><section><h3>Teacher chat</h3>${message()}</section><section><h3>Student voice</h3>${poll()}</section><section><h3>Lunch break</h3>${menu()}</section></div></div>`+foot;
if(i===9)html=`<div class="pad">${greet('What do you need today?')}<div class="grid destination-grid">${[['Calendar','Dates & events','See what’s happening for your class.','▤'],['Messages','Teacher chat','Read feedback and continue a conversation.','✉'],['Student voice','Your voice','Send a private suggestion or join a poll.','◇'],['Canteen','Lunch break','Check today’s menu and share feedback.','☷']].map(([a,t,d,icon])=>`<button class="destination card" data-action="${a}"><span class="destination-icon" aria-hidden="true">${icon}</span><h3>${t}</h3><p>${d}</p><span class="destination-label">Open ${a==='Student voice'?'student voice':a.toLowerCase()}</span></button>`).join('')}</div><div class="grid hub-info"><section class="card"><div class="meta"><h3>Today at school</h3><span class="tag">3 events</span></div>${today()}</section><section class="card"><h3>One thing to remember</h3>${event('11','Trip payment closes','Sunday · Finance office')}<p class="muted">Pay only through the school’s confirmed channels.</p><button class="textbtn" data-action="Trip details">View instructions</button></section></div></div>`+foot;
document.querySelector('#preview').innerHTML=`<div class="surface ${designs[i][2]} fade">${appFrame(html)}</div>`;document.querySelector('#concept-name').textContent=`${String(i+1).padStart(2,'0')} / ${designs[i][0]}`;document.querySelector('#concept-description').textContent=designs[i][1];document.querySelectorAll('[role=tab]').forEach((b,n)=>b.setAttribute('aria-selected',String(n===i)));selected=i;updateChoice();document.querySelector('.surface').classList.toggle('phone',phone);history.replaceState(null,'','#concept-'+(i+1));}
let selected=0,shortlist=[],phone=false;try{shortlist=JSON.parse(localStorage.getItem('highboard-design-shortlist')||'[]').filter(n=>Number.isInteger(n)&&n>=0&&n<10)}catch{}
function updateChoice(){document.querySelector('#choose').textContent=shortlist.includes(selected)?'Shortlisted ✓':'Shortlist this';document.querySelector('#choose').setAttribute('aria-pressed',String(shortlist.includes(selected)));}
document.querySelector('.options').innerHTML=designs.map((d,i)=>`<button role="tab" id="tab-${i}" aria-selected="false">${String(i+1).padStart(2,'0')} ${d[0]}</button>`).join('');document.querySelectorAll('[role=tab]').forEach((b,i)=>b.onclick=()=>render(i));document.querySelector('.options').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?9:(selected+(e.key==='ArrowRight'?1:9))%10;render(n);document.querySelector('#tab-'+n).focus()};
